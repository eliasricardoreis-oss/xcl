name: Build (teste)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --workspace

      # Testes de GPU/DXC sao pulados automaticamente sem GPU.
      # continue-on-error: por ser so teste, falha aqui nao derruba o build.
      - name: Testes
        continue-on-error: true
        run: cargo test --workspace

      - name: Enviar xcl.exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: xcl-windows-x64
          path: target/release/xcl.exe
          if-no-files-found: error
